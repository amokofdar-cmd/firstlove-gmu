<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Welcome · First Love GMU</title>
<!--
  THE DOOR FORM (Kofi, 2026-11-06). A visitor at a First Love gathering signs themselves in: name,
  phone, which gathering. On submit they see a welcome, and nothing else: whether they registered on
  the website is matched inside the church's app, never shown here.

  It posts to NOVA's website-intake function as kind "arrival" with the public anon key, the same
  route as the RSVP and prayer forms: the function writes the arrival with the door as its source
  (dated today, New York), anon is granted nothing in the database, and the hidden "company" field
  is the honeypot. An idempotency key makes a double tap one arrival.
-->
<link rel="stylesheet" href="../explore/core.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper, #fff); color: var(--ink, #0b0b0b); font-family: var(--f-display, system-ui), system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 34rem; margin: 0 auto; padding: max(3rem, env(safe-area-inset-top)) 1.5rem 3rem; }
  .mark { display: flex; align-items: center; gap: .6rem; font-family: var(--f-mono, ui-monospace, monospace); font-size: .8rem; letter-spacing: .08em; color: var(--ink-2, #555); }
  .mark i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--red, #EE0408); display: inline-block; }
  h1 { font-weight: 800; font-variation-settings: "wdth" 100; letter-spacing: -.02em; line-height: 1; font-size: clamp(2.6rem, 9vw, 3.6rem); margin: 1.5rem 0 .75rem; }
  p.lede { font-size: 1.125rem; line-height: 1.45; color: var(--ink-2, #555); margin: 0 0 2rem; }
  form { display: grid; gap: 1.25rem; }
  label, legend { display: block; font-weight: 600; font-size: 1rem; margin-bottom: .45rem; }
  input[type=text], input[type=tel] { width: 100%; font: inherit; font-size: 1.25rem; padding: .9rem 1rem; border: 1px solid var(--line, rgba(0,0,0,.14)); border-radius: 12px; background: #fff; color: inherit; }
  input:focus-visible { outline: 3px solid rgba(238,4,8,.35); outline-offset: 2px; border-color: var(--red, #EE0408); }
  fieldset { border: 0; padding: 0; margin: 0; }
  .choices { display: grid; gap: .6rem; }
  .choice { display: flex; align-items: center; gap: .75rem; padding: .9rem 1rem; border: 1px solid var(--line, rgba(0,0,0,.14)); border-radius: 12px; font-size: 1.125rem; font-weight: 500; cursor: pointer; }
  .choice input { width: 1.25rem; height: 1.25rem; accent-color: var(--red, #EE0408); }
  .choice:has(input:checked) { border-color: var(--ink, #0b0b0b); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  button { font: inherit; font-weight: 700; font-size: 1.2rem; padding: 1rem 1.25rem; border: 0; border-radius: 12px; background: var(--red, #EE0408); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .why { color: var(--red, #c00); font-weight: 600; min-height: 1.5em; margin: 0; }
  .welcome { display: none; }
  .welcome h2 { font-weight: 800; letter-spacing: -.02em; line-height: 1.05; font-size: clamp(2.2rem, 8vw, 3rem); margin: 1.5rem 0 1rem; }
  .welcome p { font-size: 1.2rem; line-height: 1.5; color: var(--ink-2, #555); }
  .done .ask { display: none; }
  .done .welcome { display: block; }
  .again { background: none; color: var(--ink, #0b0b0b); border: 1px solid var(--line, rgba(0,0,0,.14)); font-weight: 600; font-size: 1rem; }
  @media (prefers-reduced-motion: no-preference) { .welcome { animation: rise .3s ease-out both; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } } }
</style>
</head>
<body>
<main id="door">
  <div class="mark"><i></i> FIRST LOVE GMU</div>

  <section class="ask">
    <h1>Welcome</h1>
    <p class="lede">Sign in so we know you came.</p>
    <form id="door-form" novalidate>
      <div>
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="120" required>
      </div>
      <div>
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="24" required>
      </div>
      <fieldset>
        <legend>Which gathering?</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="gathering" value="bible-study"> Bible Study</label>
          <label class="choice"><input type="radio" name="gathering" value="ready20"> READY@20</label>
          <label class="choice"><input type="radio" name="gathering" value="special"> Something else</label>
        </div>
      </fieldset>
      <div class="hp" aria-hidden="true"><label for="company">Company</label><input id="company" name="company" type="text" tabindex="-1" autocomplete="off"></div>
      <p class="why" id="why" role="alert"></p>
      <button type="submit" id="send">Sign in</button>
    </form>
  </section>

  <section class="welcome" aria-live="polite">
    <h2 id="hello">Welcome</h2>
    <p>We are glad you are here. Find a seat, and someone will say hello.</p>
    <button class="again" type="button" id="again">Sign in someone else</button>
  </section>
</main>
<script>
(function () {
  var URL_ = "https://fzcujrfopvlokpqigewh.supabase.co/functions/v1/website-intake";
  // The public anon key, the same one the site's RSVP and prayer forms send. It reaches the intake
  // function and nothing else: anon is granted nothing in the database.
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6Y3VqcmZvcHZsb2twcWlnZXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2OTE5NTMsImV4cCI6MjEwMzI2Nzk1M30.bMr5xfB7t65tyZslEVEwemTZhmDcs7tNwD86Fi0_C9k";
  // Sends for real only from the GitHub host the function accepts; anywhere else (a local preview),
  // or with ?send=off, it is a dry run.
  var LIVE = /^amokofdar-cmd\.github\.io$|(^|\.)mason360\.gmu\.edu$/.test(location.hostname);
  var DRY = !LIVE || new URLSearchParams(location.search).get("send") === "off";
  var main = document.getElementById("door"), form = document.getElementById("door-form");
  var why = document.getElementById("why"), send = document.getElementById("send");
  var first = function (n) { return (n.trim().split(/\s+/)[0] || "").slice(0, 40); };
  // One key per sign-in: a retry or a double tap sends the same key, so it lands once. A new key
  // after a welcome, or once the visitor changes what they typed.
  var key = null;
  var newKey = function () {
    var r = window.crypto && crypto.randomUUID ? crypto.randomUUID()
      : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
    return "door-" + r.replace(/[^A-Za-z0-9_-]/g, "");
  };
  form.addEventListener("input", function () { key = null; });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    why.textContent = "";
    var name = form.name.value.trim(), phone = form.phone.value.trim();
    var g = form.querySelector("input[name=gathering]:checked");
    if (!name) { why.textContent = "Your name, please."; form.name.focus(); return; }
    if (!phone) { why.textContent = "Your phone number, please."; form.phone.focus(); return; }
    if (!g) { why.textContent = "Which gathering are you at?"; return; }
    if (!key) key = newKey();
    var body = { kind: "arrival", name: name, phone: phone, gathering_key: g.value, idempotency_key: key, company: form.company.value };
    send.disabled = true; send.textContent = "Signing in…";
    var done = function () {
      document.getElementById("hello").textContent = "Welcome, " + first(name);
      main.classList.add("done"); form.reset(); key = null; send.disabled = false; send.textContent = "Sign in";
    };
    if (DRY) { console.info("[First Love] door form dry run, not sent"); done(); return; }
    fetch(URL_, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, why: j && j.error }; }); },
            function () { return { status: 0 }; })
      .then(function (res) {
        if (res.status === 201) { done(); return; }
        send.disabled = false; send.textContent = "Sign in";
        why.textContent = res.status === 400 && res.why ? res.why.charAt(0).toUpperCase() + res.why.slice(1) + "." : "That did not go through. Please try again.";
      });
  });
  document.getElementById("again").addEventListener("click", function () { main.classList.remove("done"); form.name.focus(); });
})();
</script>
</body>
</html>
